services:
  wedding-portal:
    build: .
    restart: unless-stopped
    volumes:
      - wedding-data:/app/data
      - wedding-uploads:/app/uploads
      - wedding-thumbnails:/app/thumbnails
      - wedding-exports:/app/exports
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - wedding-portal
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  wedding-data:
  wedding-uploads:
  wedding-thumbnails:
  wedding-exports:
  caddy-data:
  caddy-config:
